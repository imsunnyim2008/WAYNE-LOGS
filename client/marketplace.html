<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketplace - WAYNE LOGS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f7fc;
    color:#182235;
    min-height:100vh;
}

header{
    background:#fff;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #e5ebf2;
    position:sticky;
    top:0;
    z-index:20;
}

.menu{
    font-size:32px;
    color:#3486df;
    cursor:pointer;
}

header h1{
    font-size:28px;
}

.header-right{
    display:flex;
    gap:15px;
    align-items:center;
}

.circle{
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bell{
    border:2px solid #e3e9f0;
    font-size:23px;
}

.avatar{
    background:#3486df;
    color:white;
    font-weight:bold;
    font-size:22px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 20px;
}

.hero{
    margin-bottom:25px;
}

.hero h2{
    font-size:35px;
    margin-bottom:8px;
}

.hero p{
    color:#8792a5;
    font-size:17px;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

.search-box,
select{
    width:100%;
    border:2px solid #e1e8f0;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    background:white;
    outline:none;
}

.search-box:focus,
select:focus{
    border-color:#3486df;
}

.message{
    display:none;
    padding:17px;
    border-radius:14px;
    margin-bottom:20px;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#c53030;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.product-card{
    background:white;
    border-radius:24px;
    padding:25px;
    border:1px solid #e8edf3;
    display:flex;
    flex-direction:column;
}

.product-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.platform-icon{
    width:72px;
    height:72px;
    border-radius:18px;
    background:#f1f6fc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

.status{
    padding:8px 13px;
    border-radius:20px;
    background:#eaf9ee;
    color:#2e8b49;
    font-size:14px;
    font-weight:bold;
}

.product-card h3{
    margin-top:22px;
    font-size:25px;
    line-height:1.25;
}

.description{
    color:#8490a3;
    line-height:1.6;
    margin-top:10px;
    min-height:50px;
}

.tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:20px;
}

.tag{
    background:#f2f5f9;
    color:#68758a;
    padding:8px 12px;
    border-radius:12px;
    font-size:14px;
}

.bottom{
    border-top:1px solid #e6ebf1;
    margin-top:22px;
    padding-top:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.price{
    color:#3486df;
    font-size:27px;
    font-weight:800;
}

.buy-btn{
    border:none;
    border-radius:13px;
    padding:14px 22px;
    background:#3486df;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.buy-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading,
.empty{
    grid-column:1/-1;
    background:white;
    padding:45px 20px;
    border-radius:22px;
    text-align:center;
    color:#8490a3;
    font-size:18px;
}

.product-image{
    width:72px;
    height:72px;
    border-radius:18px;
    object-fit:cover;
    background:#f1f6fc;
}

@media(max-width:750px){

    .container{
        padding:20px 15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:24px;
    }

    .bell{
        display:none;
    }

    .hero h2{
        font-size:29px;
    }
}
</style>
</head>

<body>

<header>

    <div
        class="menu"
        onclick="window.location.href='dashboard.html'"
    >
        ☰
    </div>

    <h1>Marketplace</h1>

    <div class="header-right">

        <div class="circle bell">
            🔔
        </div>

        <div
            class="circle avatar"
            id="avatar"
        >
            W
        </div>

    </div>

</header>


<main class="container">

    <section class="hero">

        <h2>Digital Marketplace</h2>

        <p>
            Browse products currently available on WAYNE LOGS.
        </p>

    </section>


    <div
        id="message"
        class="message"
    ></div>


    <section class="filters">

        <input
            type="search"
            id="searchInput"
            class="search-box"
            placeholder="Search products..."
        >

        <select id="platformFilter">

            <option value="">
                All Platforms
            </option>

        </select>

    </section>


    <section
        class="products"
        id="products"
    >

        <div class="loading">
            Loading marketplace products...
        </div>

    </section>

</main>


<script>

const API_URL =
    "https://wayne-logs.onrender.com";


let products = [];


const productsBox =
    document.getElementById("products");

const searchInput =
    document.getElementById("searchInput");

const platformFilter =
    document.getElementById("platformFilter");

const messageBox =
    document.getElementById("message");



function setAvatar(){

    const storedUser =
        localStorage.getItem("wayneUser");


    if(!storedUser){
        return;
    }


    try{

        const user =
            JSON.parse(storedUser);


        const initial =
            (
                user.firstName ||
                "W"
            )
            .charAt(0)
            .toUpperCase();


        document.getElementById(
            "avatar"
        ).textContent =
            initial;

    }catch(error){

        console.error(error);

    }

}



function showError(text){

    messageBox.textContent = text;

    messageBox.className =
        "message error";

}



function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}



function money(value){

    return "₦" +
        Number(value || 0)
        .toLocaleString(
            "en-NG"
        );

}



function getPlatformIcon(platform){

    const name =
        String(
            platform || ""
        ).toLowerCase();


    if(name.includes("facebook")){
        return "📘";
    }

    if(name.includes("instagram")){
        return "📷";
    }

    if(name.includes("tiktok")){
        return "🎵";
    }

    if(name.includes("youtube")){
        return "▶️";
    }

    if(name.includes("telegram")){
        return "✈️";
    }

    if(
        name.includes("twitter") ||
        name === "x"
    ){
        return "𝕏";
    }

    if(name.includes("snapchat")){
        return "👻";
    }

    if(name.includes("discord")){
        return "🎮";
    }

    if(name.includes("linkedin")){
        return "💼";
    }

    if(name.includes("reddit")){
        return "🟠";
    }

    return "🛍️";

}



async function loadProducts(){

    try{

        const response =
            await fetch(
                API_URL +
                "/api/products"
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Could not load products."
            );

        }


        products =
            data.products || [];


        buildPlatformFilter();

        renderProducts();


    }catch(error){

        console.error(error);

        productsBox.innerHTML =
            `
            <div class="empty">
                Could not load marketplace products.
            </div>
            `;


        showError(
            "Could not connect to the WAYNE LOGS marketplace."
        );

    }

}



function buildPlatformFilter(){

    const platforms =
        [
            ...new Set(
                products
                .map(
                    product =>
                        product.platform
                )
                .filter(Boolean)
            )
        ];


    platformFilter.innerHTML =
        `
        <option value="">
            All Platforms
        </option>
        `;


    platforms.forEach(
        platform => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                platform;


            option.textContent =
                platform;


            platformFilter.appendChild(
                option
            );

        }
    );

}



function renderProducts(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    const selectedPlatform =
        platformFilter.value
        .toLowerCase();


    const filtered =
        products.filter(
            product => {

                const searchable =
                    `
                    ${product.name || ""}
                    ${product.description || ""}
                    ${product.category || ""}
                    ${product.platform || ""}
                    `
                    .toLowerCase();


                const matchesSearch =
                    searchable.includes(
                        search
                    );


                const matchesPlatform =
                    !selectedPlatform ||
                    String(
                        product.platform || ""
                    )
                    .toLowerCase() ===
                    selectedPlatform;


                return (
                    matchesSearch &&
                    matchesPlatform
                );

            }
        );


    productsBox.innerHTML = "";


    if(filtered.length === 0){

        productsBox.innerHTML =
            `
            <div class="empty">
                No marketplace products found.
            </div>
            `;

        return;

    }


    filtered.forEach(
        product => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            const stock =
                Number(
                    product.stock || 0
                );


            const available =
                stock > 0;


            const image =
                product.imageUrl
                ?
                `
                <img
                    class="product-image"
                    src="${escapeHtml(product.imageUrl)}"
                    alt="${escapeHtml(product.name)}"
                >
                `
                :
                `
                <div class="platform-icon">
                    ${getPlatformIcon(product.platform)}
                </div>
                `;


            card.innerHTML =
            `
                <div class="product-top">

                    ${image}

                    <span class="status">
                        ${
                            available
                            ? "Available"
                            : "Out of Stock"
                        }
                    </span>

                </div>


                <h3>
                    ${escapeHtml(product.name)}
                </h3>


                <p class="description">
                    ${
                        escapeHtml(
                            product.description ||
                            "WAYNE LOGS marketplace product."
                        )
                    }
                </p>


                <div class="tags">

                    <span class="tag">
                        ${
                            escapeHtml(
                                product.platform ||
                                product.category
                            )
                        }
                    </span>

                    <span class="tag">
                        Stock: ${stock}
                    </span>

                    <span class="tag">
                        ${
                            escapeHtml(
                                product.deliveryType ||
                                "manual"
                            )
                        }
                    </span>

                </div>


                <div class="bottom">

                    <div class="price">
                        ${money(product.price)}
                    </div>


                    <button
                        class="buy-btn"
                        ${available ? "" : "disabled"}
                        onclick="buyProduct('${product._id}')"
                    >
                        Buy
                    </button>

                </div>
            `;


            productsBox.appendChild(
                card
            );

        }
    );

}



window.buyProduct =
function(productId){

    window.location.href =
        "checkout.html?product=" +
        encodeURIComponent(
            productId
        );

};



searchInput.addEventListener(
    "input",
    renderProducts
);


platformFilter.addEventListener(
    "change",
    renderProducts
);



setAvatar();

loadProducts();

</script>

</body>
</html>
