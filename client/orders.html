<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | WAYNE LOGS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#3486df;
    --dark:#10213f;
    --bg:#f4f7fb;
    --text:#172033;
    --muted:#8792a5;
    --border:#e4eaf2;
    --green:#16803c;
    --orange:#a96800;
    --red:#c53030;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

a{
    text-decoration:none;
}

header{
    background:white;
    border-bottom:1px solid var(--border);
    padding:18px 24px;
}

.nav{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    color:var(--blue);
    font-size:25px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.nav-link{
    color:var(--blue);
    font-weight:bold;
}

main{
    max-width:1150px;
    margin:auto;
    padding:35px 20px;
}

.hero{
    background:linear-gradient(135deg,#10213f,#3486df);
    color:white;
    border-radius:25px;
    padding:35px;
    margin-bottom:25px;
}

.hero h1{
    font-size:34px;
}

.hero p{
    margin-top:10px;
    line-height:1.6;
    opacity:.9;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
    margin-bottom:22px;
}

.card h2{
    font-size:23px;
    margin-bottom:7px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:22px;
    line-height:1.6;
}

.message{
    display:none;
    padding:16px;
    border-radius:13px;
    margin-bottom:20px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:var(--red);
}

.message.success{
    display:block;
    background:#edfff2;
    color:var(--green);
}

.message.info{
    display:block;
    background:#edf6ff;
    color:var(--blue);
}

.loading{
    text-align:center;
    color:var(--muted);
    padding:35px;
}

.verify-box{
    display:none;
    background:#edf6ff;
    color:var(--blue);
    border:1px solid #cfe5ff;
    padding:20px;
    border-radius:16px;
    margin-bottom:22px;
    font-weight:bold;
    line-height:1.6;
}

.orders{
    display:grid;
    gap:16px;
}

.order{
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:20px;
    align-items:center;
}

.order-main{
    display:flex;
    gap:16px;
    align-items:flex-start;
}

.order-image{
    width:85px;
    height:85px;
    border-radius:14px;
    object-fit:cover;
    background:#edf3f9;
    flex-shrink:0;
}

.order-placeholder{
    width:85px;
    height:85px;
    border-radius:14px;
    background:#edf3f9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    flex-shrink:0;
}

.order-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:7px;
}

.order-meta{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
    word-break:break-word;
}

.order-price{
    color:var(--blue);
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    text-align:right;
}

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fff6e8;
    color:var(--orange);
}

.paid,
.completed{
    background:#eaf9ee;
    color:var(--green);
}

.processing{
    background:#edf5ff;
    color:var(--blue);
}

.failed,
.cancelled,
.refunded{
    background:#fff0f0;
    color:var(--red);
}

.btn{
    border:0;
    background:var(--blue);
    color:white;
    padding:11px 15px;
    border-radius:11px;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
    display:inline-block;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.detail{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
}

.detail span{
    color:var(--muted);
    display:block;
    font-size:13px;
    margin-bottom:6px;
}

.delivery{
    margin-top:20px;
    background:#effff4;
    border:1px solid #c8efd4;
    padding:20px;
    border-radius:16px;
}

.delivery h3{
    color:var(--green);
    margin-bottom:10px;
}

.delivery-content{
    white-space:pre-wrap;
    word-break:break-word;
    background:white;
    border:1px solid #dceee2;
    border-radius:12px;
    padding:16px;
    font-family:monospace;
    line-height:1.7;
}

.locked{
    margin-top:20px;
    background:#f5f8fc;
    border:1px solid var(--border);
    padding:18px;
    border-radius:15px;
    color:#607089;
    line-height:1.6;
}

.empty{
    text-align:center;
    padding:45px 20px;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

.empty p{
    color:var(--muted);
    margin:10px 0 20px;
}

@media(max-width:700px){

    .order{
        grid-template-columns:1fr;
    }

    .order-price{
        text-align:left;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .hero{
        padding:28px 22px;
    }

    .hero h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>

    <div class="nav">

        <a href="index.html" class="logo">
            WAYNE LOGS
        </a>

        <div class="nav-links">

            <a href="dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="marketplace.html" class="nav-link">
                Marketplace
            </a>

        </div>

    </div>

</header>


<main>

    <div class="hero">

        <h1>My Orders</h1>

        <p>
            Track your purchases, payment status
            and completed digital delivery.
        </p>

    </div>


    <div
        id="verifyBox"
        class="verify-box"
    >
        Verifying your Paystack payment securely...
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <section
        class="card"
        id="selectedOrderCard"
        style="display:none"
    >

        <h2>Order Details</h2>

        <p class="subtitle">
            Information about your selected order.
        </p>

        <div id="selectedOrder"></div>

    </section>


    <section class="card">

        <h2>Order History</h2>

        <p class="subtitle">
            Orders connected to your WAYNE LOGS account.
        </p>

        <div
            id="loading"
            class="loading"
        >
            Loading your orders...
        </div>

        <div
            id="orders"
            class="orders"
        ></div>

    </section>

</main>


<script>

const API_URL =
    "https://wayne-logs.onrender.com";


const token =
    localStorage.getItem(
        "wayneToken"
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const selectedOrderId =
    params.get("order");


const paymentCallback =
    params.get("payment") ===
    "callback";


const paystackReference =
    params.get("reference");


function money(value){

    return "₦" +
        Number(value || 0)
        .toLocaleString("en-NG");

}


function safeText(value){

    return value === undefined ||
           value === null
        ? ""
        : String(value);

}


function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        safeText(value);


    return div.innerHTML;

}


function showMessage(
    text,
    type = "error"
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " + type;

}


function formatDate(value){

    if(!value){
        return "—";
    }


    return new Date(value)
        .toLocaleString();

}


function badgeClass(value){

    const allowed = [
        "pending",
        "paid",
        "completed",
        "processing",
        "failed",
        "cancelled",
        "refunded"
    ];


    return allowed.includes(value)
        ? value
        : "pending";

}


// ==========================================
// PAYSTACK CALLBACK VERIFICATION
// ==========================================

async function verifyCallbackPayment(){

    if(!paymentCallback){

        return;

    }


    const verifyBox =
        document.getElementById(
            "verifyBox"
        );


    verifyBox.style.display =
        "block";


    if(!selectedOrderId){

        verifyBox.style.display =
            "none";


        showMessage(
            "Payment returned without an order ID."
        );


        return;

    }


    if(!paystackReference){

        verifyBox.style.display =
            "none";


        showMessage(
            "Payment reference was not returned by Paystack."
        );


        return;

    }


    try{

        const response =
            await fetch(
                API_URL +
                "/api/orders/" +
                encodeURIComponent(
                    selectedOrderId
                ) +
                "/paystack/verify",
                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        Authorization:
                            "Bearer " +
                            token

                    },

                    body:
                        JSON.stringify({

                            reference:
                                paystackReference

                        })

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Payment could not be verified."
            );

        }


        showMessage(
            data.message ||
            "Payment verified successfully.",
            "success"
        );


        /*
         * Remove Paystack reference from
         * browser address after verification.
         */
        window.history.replaceState(
            {},
            "",
            "orders.html?order=" +
            encodeURIComponent(
                selectedOrderId
            )
        );


    }catch(error){

        showMessage(
            error.message ||
            "Payment verification failed."
        );

    }finally{

        verifyBox.style.display =
            "none";

    }

}


// ==========================================
// LOAD CUSTOMER ORDERS
// ==========================================

async function loadOrders(){

    try{

        const response =
            await fetch(
                API_URL +
                "/api/orders/my",
                {

                    headers:{

                        Authorization:
                            "Bearer " +
                            token

                    }

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Could not load orders."
            );

        }


        renderOrders(
            data.orders || []
        );


        if(selectedOrderId){

            await loadSelectedOrder(
                selectedOrderId
            );

        }


    }catch(error){

        showMessage(
            error.message
        );


    }finally{

        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

}


// ==========================================
// RENDER ORDER HISTORY
// ==========================================

function renderOrders(orders){

    const container =
        document.getElementById(
            "orders"
        );


    container.innerHTML =
        "";


    if(
        orders.length === 0
    ){

        container.innerHTML =
            `
            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h3>
                    No orders yet
                </h3>

                <p>
                    Products you order will appear here.
                </p>

                <a
                    href="marketplace.html"
                    class="btn"
                >
                    Browse Marketplace
                </a>

            </div>
            `;


        return;

    }


    orders.forEach(
        order => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "order";


            let imageHtml;


            if(
                order.productImage
            ){

                imageHtml =
                    `
                    <img
                        src="${order.productImage}"
                        class="order-image"
                        alt=""
                    >
                    `;

            }else{

                imageHtml =
                    `
                    <div class="order-placeholder">
                        📦
                    </div>
                    `;

            }


            row.innerHTML =
                `
                <div class="order-main">

                    ${imageHtml}

                    <div>

                        <div class="order-name">

                            ${
                                escapeHtml(
                                    order.productName
                                )
                            }

                        </div>


                        <div class="order-meta">

                            ${
                                escapeHtml(
                                    order.platform ||
                                    "Digital Product"
                                )
                            }

                            <br>

                            Order:
                            ${
                                escapeHtml(
                                    order._id
                                )
                            }

                            <br>

                            ${
                                formatDate(
                                    order.createdAt
                                )
                            }

                        </div>


                        <div class="badges">

                            <span
                                class="badge ${
                                    badgeClass(
                                        order.paymentStatus
                                    )
                                }"
                            >
                                Payment:
                                ${
                                    escapeHtml(
                                        order.paymentStatus
                                    )
                                }
                            </span>


                            <span
                                class="badge ${
                                    badgeClass(
                                        order.status
                                    )
                                }"
                            >
                                Order:
                                ${
                                    escapeHtml(
                                        order.status
                                    )
                                }
                            </span>

                        </div>

                    </div>

                </div>


                <div>

                    <div class="order-price">

                        ${
                            money(
                                order.totalAmount
                            )
                        }

                    </div>


                    <button
                        class="btn"
                        onclick="viewOrder('${order._id}')"
                    >
                        View Order
                    </button>

                </div>
                `;


            container.appendChild(
                row
            );

        }
    );

}


// ==========================================
// VIEW ORDER
// ==========================================

window.viewOrder =
function(id){

    window.location.href =
        "orders.html?order=" +
        encodeURIComponent(id);

};


// ==========================================
// LOAD ONE ORDER
// ==========================================

async function loadSelectedOrder(id){

    try{

        const response =
            await fetch(
                API_URL +
                "/api/orders/" +
                encodeURIComponent(id),
                {

                    headers:{

                        Authorization:
                            "Bearer " +
                            token

                    }

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Could not load order."
            );

        }


        renderSelectedOrder(
            data.order
        );


    }catch(error){

        showMessage(
            error.message
        );

    }

}


// ==========================================
// RENDER SELECTED ORDER
// ==========================================

function renderSelectedOrder(order){

    const card =
        document.getElementById(
            "selectedOrderCard"
        );


    const box =
        document.getElementById(
            "selectedOrder"
        );


    card.style.display =
        "block";


    let deliveryHtml;


    if(
        order.paymentStatus ===
        "paid" &&
        order.status ===
        "completed" &&
        order.deliveryContent
    ){

        deliveryHtml =
            `
            <div class="delivery">

                <h3>
                    🔓 Your Delivery
                </h3>

                <div class="delivery-content">
                    ${
                        escapeHtml(
                            order.deliveryContent
                        )
                    }
                </div>

            </div>
            `;

    }else if(
        order.paymentStatus ===
        "paid" &&
        order.status ===
        "processing"
    ){

        deliveryHtml =
            `
            <div class="locked">

                ✅ Payment verified.

                <br><br>

                Your order is currently being processed.
                Delivery will appear here when completed.

            </div>
            `;

    }else{

        deliveryHtml =
            `
            <div class="locked">

                🔒 Private fulfillment is locked.

                <br><br>

                It becomes available only after
                Paystack payment is verified by
                the WAYNE LOGS server and the
                order is completed.

            </div>
            `;

    }


    box.innerHTML =
        `
        <div class="detail-grid">

            <div class="detail">

                <span>
                    Product
                </span>

                <strong>
                    ${
                        escapeHtml(
                            order.productName
                        )
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Total
                </span>

                <strong>
                    ${
                        money(
                            order.totalAmount
                        )
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Payment Status
                </span>

                <strong>
                    ${
                        escapeHtml(
                            order.paymentStatus
                        )
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Order Status
                </span>

                <strong>
                    ${
                        escapeHtml(
                            order.status
                        )
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Payment Method
                </span>

                <strong>
                    ${
                        escapeHtml(
                            order.paymentMethod
                        )
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Order Date
                </span>

                <strong>
                    ${
                        formatDate(
                            order.createdAt
                        )
                    }
                </strong>

            </div>

        </div>

        ${deliveryHtml}
        `;

}


// ==========================================
// START PAGE
// ==========================================

async function start(){

    if(!token){

        window.location.replace(
            "login.html"
        );

        return;

    }


    /*
     * If the customer is returning
     * from Paystack, verify first.
     */
    if(paymentCallback){

        await verifyCallbackPayment();

    }


    /*
     * Then reload MongoDB orders so
     * the new paid/completed status
     * is displayed.
     */
    await loadOrders();

}


start();

</script>

</body>
</html>
