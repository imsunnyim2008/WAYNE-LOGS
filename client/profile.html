<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - WAYNE LOGS</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f3f7fc;
            color:#172033;
            min-height:100vh;
        }

        header{
            background:white;
            min-height:90px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:20px 30px;
            border-bottom:1px solid #e8edf4;
            position:sticky;
            top:0;
            z-index:20;
        }

        .menu{
            font-size:35px;
            color:#3486df;
            cursor:pointer;
        }

        header h1{
            font-size:28px;
        }

        .header-right{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .bell,
        .avatar-small{
            width:55px;
            height:55px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .bell{
            border:2px solid #e5ebf2;
            font-size:25px;
        }

        .avatar-small{
            background:#3486df;
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .container{
            max-width:900px;
            margin:auto;
            padding:30px;
        }

        .message{
            display:none;
            padding:18px 22px;
            border-radius:16px;
            margin-bottom:25px;
            font-size:17px;
        }

        .message.error{
            display:block;
            background:#fff0f0;
            color:#c53030;
        }

        .message.success{
            display:block;
            background:#edfff2;
            color:#16873c;
        }

        .profile-card{
            background:linear-gradient(135deg,#347fd2,#49a0eb);
            border-radius:30px;
            padding:55px 25px;
            text-align:center;
            color:white;
            margin-bottom:30px;
        }

        .avatar-large{
            width:150px;
            height:150px;
            border-radius:50%;
            background:white;
            color:#3486df;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 25px;
            font-size:60px;
            font-weight:bold;
        }

        #fullName{
            font-size:38px;
            margin-bottom:10px;
        }

        #profileEmail{
            font-size:19px;
            opacity:.9;
        }

        .status{
            display:inline-block;
            background:rgba(255,255,255,.18);
            padding:10px 18px;
            border-radius:30px;
            margin-top:20px;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:28px;
            margin-bottom:25px;
            box-shadow:0 8px 30px rgba(0,0,0,.04);
        }

        .card h2{
            font-size:30px;
            margin-bottom:8px;
        }

        .card-subtitle{
            color:#8a95a7;
            margin-bottom:28px;
            font-size:17px;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:22px;
        }

        .field{
            margin-bottom:20px;
        }

        .field.full{
            grid-column:1 / -1;
        }

        label{
            display:block;
            font-size:17px;
            font-weight:700;
            margin-bottom:10px;
        }

        input{
            width:100%;
            border:2px solid #e1e8f0;
            border-radius:15px;
            padding:17px;
            font-size:17px;
            background:#f9fbfd;
            color:#172033;
            outline:none;
        }

        input:focus{
            border-color:#3486df;
        }

        input[readonly]{
            background:#f3f6f9;
            color:#657084;
        }

        .wallet-box{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            padding:22px;
            background:#f5f9ff;
            border-radius:18px;
            margin-top:10px;
        }

        .wallet-box strong{
            font-size:28px;
            color:#3486df;
        }

        .role{
            text-transform:capitalize;
        }

        .actions{
            display:flex;
            gap:15px;
            flex-wrap:wrap;
        }

        button,
        .link-btn{
            border:none;
            border-radius:14px;
            padding:15px 22px;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
        }

        .primary{
            background:#3486df;
            color:white;
        }

        .secondary{
            background:#eef4fb;
            color:#3486df;
        }

        .danger{
            background:#fff0f0;
            color:#c53030;
        }

        .loading-overlay{
            position:fixed;
            inset:0;
            background:rgba(255,255,255,.92);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:100;
        }

        .loading-box{
            text-align:center;
            color:#3486df;
        }

        .spinner{
            width:55px;
            height:55px;
            border:6px solid #dceaff;
            border-top-color:#3486df;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:0 auto 20px;
        }

        @keyframes spin{
            to{transform:rotate(360deg);}
        }

        @media(max-width:650px){
            header{
                padding:17px 20px;
            }

            header h1{
                font-size:23px;
            }

            .container{
                padding:22px 16px;
            }

            .grid{
                grid-template-columns:1fr;
            }

            .field.full{
                grid-column:auto;
            }

            .profile-card{
                padding:45px 20px;
            }

            #fullName{
                font-size:31px;
            }

            .card{
                padding:27px 22px;
            }

            .bell{
                display:none;
            }
        }
    </style>
</head>

<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <h2>Loading your profile...</h2>
    </div>
</div>

<header>
    <div class="menu" onclick="window.location.href='dashboard.html'">☰</div>

    <h1>My Profile</h1>

    <div class="header-right">
        <div class="bell">🔔</div>
        <div class="avatar-small" id="smallAvatar">W</div>
    </div>
</header>

<main class="container">

    <div id="message" class="message"></div>

    <section class="profile-card">

        <div class="avatar-large" id="largeAvatar">
            W
        </div>

        <h2 id="fullName">Loading...</h2>

        <p id="profileEmail">Loading...</p>

        <div class="status">
            ✓ Active Account
        </div>

    </section>

    <section class="card">

        <h2>Personal Information</h2>

        <p class="card-subtitle">
            Your account information is loaded securely from WAYNE LOGS.
        </p>

        <div class="grid">

            <div class="field">
                <label>First Name</label>
                <input id="firstName" readonly>
            </div>

            <div class="field">
                <label>Last Name</label>
                <input id="lastName" readonly>
            </div>

            <div class="field full">
                <label>Email Address</label>
                <input id="email" readonly>
            </div>

            <div class="field full">
                <label>Phone Number</label>
                <input id="phone" readonly>
            </div>

            <div class="field">
                <label>Account Role</label>
                <input id="role" class="role" readonly>
            </div>

            <div class="field">
                <label>Account Status</label>
                <input id="accountStatus" value="Active" readonly>
            </div>

        </div>

    </section>

    <section class="card">

        <h2>Wallet</h2>

        <p class="card-subtitle">
            Your current WAYNE LOGS wallet balance.
        </p>

        <div class="wallet-box">
            <span>Available Balance</span>
            <strong id="walletBalance">₦0.00</strong>
        </div>

    </section>

    <section class="card">

        <h2>Account Actions</h2>

        <div class="actions">

            <a class="link-btn secondary" href="dashboard.html">
                Dashboard
            </a>

            <a class="link-btn secondary" href="wallet.html">
                Wallet
            </a>

            <a class="link-btn secondary" href="settings.html">
                Settings
            </a>

            <button class="danger" id="logoutButton">
                Logout
            </button>

        </div>

    </section>

</main>

<script>

const API_URL = "https://wayne-logs.onrender.com";

const token = localStorage.getItem("wayneToken");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const messageBox =
    document.getElementById("message");


function showMessage(text, type){

    messageBox.textContent = text;
    messageBox.className = "message " + type;

}


function logout(){

    localStorage.removeItem("wayneToken");
    localStorage.removeItem("wayneUser");

    window.location.replace("login.html");

}


document
    .getElementById("logoutButton")
    .addEventListener("click", logout);


if(!token){

    logout();

}


async function loadProfile(){

    try{

        const response = await fetch(
            API_URL + "/api/protected",
            {
                method:"GET",

                headers:{
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        let data;

        try{

            data = await response.json();

        }catch(error){

            throw new Error(
                "Invalid server response."
            );

        }


        if(
            response.status === 401 ||
            response.status === 403
        ){

            logout();
            return;

        }


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Could not load profile."
            );

        }


        const user = data.user;


        localStorage.setItem(
            "wayneUser",
            JSON.stringify(user)
        );


        const firstName =
            user.firstName || "";

        const lastName =
            user.lastName || "";

        const fullName =
            `${firstName} ${lastName}`.trim();


        document.getElementById(
            "fullName"
        ).textContent =
            fullName || "WAYNE LOGS User";


        document.getElementById(
            "profileEmail"
        ).textContent =
            user.email || "";


        document.getElementById(
            "firstName"
        ).value =
            firstName;


        document.getElementById(
            "lastName"
        ).value =
            lastName;


        document.getElementById(
            "email"
        ).value =
            user.email || "";


        document.getElementById(
            "phone"
        ).value =
            user.phone || "";


        document.getElementById(
            "role"
        ).value =
            user.role || "user";


        const balance =
            Number(user.walletBalance || 0);


        document.getElementById(
            "walletBalance"
        ).textContent =
            "₦" +
            balance.toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );


        const initial =
            firstName
                ? firstName.charAt(0).toUpperCase()
                : "W";


        document.getElementById(
            "largeAvatar"
        ).textContent =
            initial;


        document.getElementById(
            "smallAvatar"
        ).textContent =
            initial;


    }catch(error){

        console.error(error);

        showMessage(
            "Could not connect to the WAYNE LOGS server. Please try again.",
            "error"
        );

    }finally{

        loadingOverlay.style.display =
            "none";

    }

}


loadProfile();

</script>

</body>
</html>
