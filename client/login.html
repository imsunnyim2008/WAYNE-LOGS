<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - WAYNE LOGS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .page {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            color: #3278d1;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand p {
            color: #8994a8;
            font-size: 18px;
            margin-top: 8px;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.06);
        }

        .card h2 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b95a7;
            margin-bottom: 28px;
            font-size: 17px;
        }

        .message {
            display: none;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-size: 17px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #c93434;
        }

        .message.success {
            display: block;
            background: #edfff2;
            color: #16873c;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 10px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            border: 2px solid #e1e7ef;
            border-radius: 15px;
            padding: 17px 18px;
            font-size: 18px;
            outline: none;
            background: #fbfcfe;
        }

        input:focus {
            border-color: #3278d1;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 80px;
        }

        .show-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #3278d1;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 8px 0 26px;
            flex-wrap: wrap;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #7c8799;
            font-weight: 600;
        }

        .remember input {
            width: 20px;
            height: 20px;
        }

        .forgot {
            color: #3278d1;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 17px;
            font-size: 19px;
            font-weight: 700;
            background: #3278d1;
            color: white;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #2869bd;
        }

        .login-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .bottom {
            text-align: center;
            margin-top: 27px;
            color: #8994a8;
            font-size: 17px;
        }

        .bottom a {
            color: #3278d1;
            text-decoration: none;
            font-weight: 700;
        }

        .home {
            text-align: center;
            margin-top: 25px;
        }

        .home a {
            color: #8994a8;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding-top: 45px;
            }

            .brand h1 {
                font-size: 36px;
            }

            .card {
                padding: 27px 22px;
                border-radius: 24px;
            }

            .card h2 {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        <h1>WAYNE LOGS</h1>
        <p>Login to your marketplace account</p>
    </div>

    <div class="card">

        <h2>Welcome Back</h2>
        <p class="subtitle">
            Enter your account details to continue.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        id="showPassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" class="forgot">
                    Forgot password?
                </a>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <div class="home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</div>

<script>

const API_URL = "https://wayne-logs.onrender.com";

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberMe = document.getElementById("rememberMe");
const loginButton = document.getElementById("loginButton");
const messageBox = document.getElementById("message");
const showPassword = document.getElementById("showPassword");


/* LOAD REMEMBERED EMAIL */

const rememberedEmail = localStorage.getItem("wayneRememberedEmail");

if (rememberedEmail) {
    emailInput.value = rememberedEmail;
    rememberMe.checked = true;
}


/* SHOW / HIDE PASSWORD */

showPassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";
        showPassword.textContent = "Show";

    }

});


/* DISPLAY MESSAGE */

function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;

}


/* LOGIN */

loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    showMessage(
        "Connecting to WAYNE LOGS...",
        "success"
    );


    try {

        const controller = new AbortController();

        const timeout = setTimeout(function () {
            controller.abort();
        }, 90000);


        const response = await fetch(
            API_URL + "/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                }),

                signal: controller.signal
            }
        );


        clearTimeout(timeout);


        let data;

        try {
            data = await response.json();
        } catch (error) {

            throw new Error(
                "The server returned an invalid response."
            );

        }


        if (!response.ok || !data.success) {

            showMessage(
                data.message || "Login failed.",
                "error"
            );

            return;
        }


        /* SAVE LOGIN TOKEN */

        localStorage.setItem(
            "wayneToken",
            data.token
        );


        /* SAVE USER */

        localStorage.setItem(
            "wayneUser",
            JSON.stringify(data.user)
        );


        /* REMEMBER EMAIL */

        if (rememberMe.checked) {

            localStorage.setItem(
                "wayneRememberedEmail",
                email
            );

        } else {

            localStorage.removeItem(
                "wayneRememberedEmail"
            );

        }


        showMessage(
            "Login successful. Redirecting...",
            "success"
        );


        setTimeout(function () {

            if (
                data.user &&
                data.user.role === "admin"
            ) {

                window.location.href =
                    "admin.html";

            } else {

                window.location.href =
                    "dashboard.html";

            }

        }, 700);


    } catch (error) {

        console.error(error);


        if (error.name === "AbortError") {

            showMessage(
                "The server took too long to respond. Please try again.",
                "error"
            );

        } else {

            showMessage(
                "Could not connect to the WAYNE LOGS server. Please try again.",
                "error"
            );

        }

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

    }

});

</script>

</body>
</html>
