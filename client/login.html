<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - WAYNE LOGS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f8fc;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0785df;
    font-size:28px;
}

.logo p{
    color:#8a95a4;
    font-size:12px;
    margin-top:4px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
}

input{
    width:100%;
    height:49px;
    border:1px solid #dfe6ee;
    border-radius:10px;
    padding:0 14px;
    background:#f9fbfd;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0785df;
    background:white;
    box-shadow:0 0 0 4px rgba(7,133,223,.08);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show-btn{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#0785df;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0785df;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:4px;
}

.login-btn:hover{
    background:#006fc0;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:16px;
}

.success{
    display:block;
    background:#eaf8ef;
    color:#16804a;
}

.error{
    display:block;
    background:#fff0f0;
    color:#c62828;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:17px;
    font-size:12px;
    color:#7d8898;
}

.remember{
    display:flex;
    align-items:center;
    gap:6px;
}

.remember input{
    width:auto;
    height:auto;
}

.options a{
    color:#0785df;
    text-decoration:none;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#7d8898;
    font-size:13px;
}

.register-link a{
    color:#0785df;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    text-align:center;
    margin-top:14px;
}

.home-link a{
    color:#7d8898;
    font-size:12px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>WAYNE LOGS</h1>
        <p>Login to your marketplace account</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required>
        </div>

        <div class="form-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    id="showPassword">
                    Show
                </button>

            </div>

        </div>

        <div class="options">

            <label class="remember">
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>

            <a href="#">
                Forgot password?
            </a>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <div class="home-link">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

const loginForm =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");


showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";
            showPassword.textContent = "Hide";

        }else{

            password.type = "password";
            showPassword.textContent = "Show";

        }

    }
);


loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const emailValue =
            email.value.trim();

        const passwordValue =
            password.value;


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                            "application/json"
                        },

                        body:JSON.stringify({
                            email:emailValue,
                            password:passwordValue
                        })
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                showMessage(
                    data.message ||
                    "Login failed.",
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;

            }


            localStorage.setItem(
                "wayneToken",
                data.token
            );


            localStorage.setItem(
                "wayneUser",
                JSON.stringify(
                    data.user
                )
            );


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(function(){

                if(data.user.role === "admin"){

                    window.location.href =
                        "admin.html";

                }else{

                    window.location.href =
                        "dashboard.html";

                }

            },1200);


        }catch(error){

            showMessage(
                "Could not connect to the WAYNE LOGS server.",
                "error"
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";

        }

    }
);


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}

</script>

</body>
</html>
