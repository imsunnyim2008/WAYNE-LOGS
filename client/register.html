<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - WAYNE LOGS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f8fc;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#1f2937;
}

.container{
    width:100%;
    max-width:470px;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    color:#0785df;
    font-size:30px;
}

.brand p{
    color:#8995a6;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
}

.card{
    background:white;
    border:1px solid #e8edf3;
    border-radius:20px;
    padding:30px;
    box-shadow:0 18px 45px rgba(0,0,0,.06);
}

.card h2{
    margin-bottom:7px;
    font-size:24px;
}

.subtitle{
    color:#8793a3;
    font-size:13px;
    margin-bottom:24px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:49px;
    border:1px solid #dfe6ee;
    border-radius:11px;
    background:#f9fbfd;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0785df;
    background:white;
    box-shadow:0 0 0 4px rgba(7,133,223,.08);
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:11px;
    background:#0785df;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:17px;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#c62828;
}

.message.success{
    display:block;
    background:#eaf8ef;
    color:#177245;
}

.login-link{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#7a8797;
}

.login-link a{
    color:#0785df;
    text-decoration:none;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#667085;
    text-decoration:none;
    font-size:13px;
}

@media(max-width:520px){
    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .card{
        padding:23px 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>WAYNE LOGS</h1>
        <p>Digital Marketplace</p>
    </div>

    <div class="card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join WAYNE LOGS and start using our services.
        </p>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <div class="row">

                <div class="form-group">
                    <label>First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        required
                        autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        required
                        autocomplete="family-name">
                </div>

            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    required
                    autocomplete="tel">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    required
                    autocomplete="new-password">
            </div>

            <button type="submit" id="registerBtn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

const registerForm =
    document.getElementById("registerForm");

const registerBtn =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const firstName =
            document.getElementById("firstName")
            .value.trim();

        const lastName =
            document.getElementById("lastName")
            .value.trim();

        const email =
            document.getElementById("email")
            .value.trim();

        const phone =
            document.getElementById("phone")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        message.className = "message";
        message.textContent = "";


        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        registerBtn.disabled = true;
        registerBtn.textContent =
            "Creating account...";


        try{

            const response =
                await fetch(
                    "https://wayne-logs.onrender.com/api/auth/register",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                            "application/json"
                        },

                        body:JSON.stringify({
                            firstName,
                            lastName,
                            email,
                            phone,
                            password
                        })
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                showMessage(
                    data.message ||
                    "Registration failed.",
                    "error"
                );

                return;
            }


            showMessage(
                "Account created successfully. Redirecting to login...",
                "success"
            );


            registerForm.reset();


            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                1500
            );


        }catch(error){

            showMessage(
                "Could not connect to the WAYNE LOGS server.",
                "error"
            );

        }finally{

            registerBtn.disabled = false;
            registerBtn.textContent =
                "Create Account";

        }

    }
);


function showMessage(text,type){

    message.textContent = text;
    message.className =
        "message " + type;

}

</script>

</body>
</html>
