<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - WAYNE LOGS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f8fc;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:460px;
    background:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0785df;
    font-size:28px;
}

.logo p{
    color:#8a95a4;
    font-size:12px;
    margin-top:4px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
}

input{
    width:100%;
    height:49px;
    border:1px solid #dfe6ee;
    border-radius:10px;
    padding:0 14px;
    background:#f9fbfd;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#0785df;
    background:white;
    box-shadow:0 0 0 4px rgba(7,133,223,.08);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show-btn{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#0785df;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0785df;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:4px;
}

.register-btn:hover{
    background:#006fc0;
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:16px;
}

.success{
    display:block;
    background:#eaf8ef;
    color:#16804a;
}

.error{
    display:block;
    background:#fff0f0;
    color:#c62828;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#7d8898;
    font-size:13px;
}

.login-link a{
    color:#0785df;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    text-align:center;
    margin-top:14px;
}

.home-link a{
    color:#7d8898;
    font-size:12px;
    text-decoration:none;
}

@media(max-width:500px){
    .register-box{
        padding:25px 18px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">
        <h1>WAYNE LOGS</h1>
        <p>Create your marketplace account</p>
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">

        <div class="form-row">

            <div class="form-group">
                <label>First Name</label>
                <input
                    type="text"
                    id="firstName"
                    placeholder="First name"
                    required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                    required>
            </div>

        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="08012345678"
                required>
        </div>

        <div class="form-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('password', this)">
                    Show
                </button>

            </div>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('confirmPassword', this)">
                    Show
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="register-btn"
            id="registerBtn">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="home-link">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerBtn = document.getElementById("registerBtn");

function togglePassword(id, button){

    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        button.textContent = "Hide";
    }else{
        input.type = "password";
        button.textContent = "Show";
    }

}

form.addEventListener("submit", async function(event){

    event.preventDefault();

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    registerBtn.disabled = true;
    registerBtn.textContent = "Creating Account...";


    try{

        const response = await fetch(
            "http://localhost:5000/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    firstName,
                    lastName,
                    email,
                    phone,
                    password
                })
            }
        );


        const data = await response.json();


        if(!response.ok){

            showMessage(
                data.message || "Registration failed.",
                "error"
            );

            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";

            return;
        }


        showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "login.html";

        },1500);


    }catch(error){

        showMessage(
            "Could not connect to the WAYNE LOGS server.",
            "error"
        );

        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";

    }

});


function showMessage(text, type){

    message.textContent = text;

    message.className =
        "message " + type;

}

</script>

</body>
</html>
